[project]
name = "demand-forecasting"
version = "1.0.0"
description = "AI-Based Demand Forecasting for Inventory Optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "tensorflow==2.16.2",
    "xgboost==2.1.1",
    "statsmodels==0.14.4",
    "streamlit==1.38.0",
    "plotly==5.24.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "openpyxl==3.1.5",
    "scipy==1.13.1",
    "pyarrow==17.0.0",
    "duckdb==1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
backend = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -W error::FutureWarning -W error::DeprecationWarning"
filterwarnings = [
    "ignore::UserWarning:tensorflow",
    "ignore::UserWarning:keras",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["dashboard/", "backend/"]