[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[theme]
primaryColor = "#1e40af"
backgroundColor = "#f1f5f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true
postScriptGC = true
enumCoercion = "off"
fastReruns = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s: %(message)s"

[global]
disableWatchdogWarning = true
showWarningOnDirectExecution = false